# /srv/testmaster/docker-compose.yml — per-project app stack.
#
# Depends on the shared stack (deploy/shared/docker-compose.yml) being
# up. We attach to its `edge` (caddy ↔ apps) and `data` (apps ↔
# postgres/minio) networks as external resources.

name: testmaster

networks:
  edge:
    external: true
  data:
    external: true

services:
  app:
    container_name: testmaster_app
    # Build context is the project root; this compose file lives in
    # deploy/testmaster/ next to its own .env.
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [edge, data]
    env_file:
      - .env
    environment:
      # These are the only env vars that vary between dev and prod;
      # everything else lives in .env (copy from .env.example).
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://s3.${DOMAIN}
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # No published ports — traffic only via caddy.
