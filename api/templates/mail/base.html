<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ subject }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1c1a18; background: #f9f6ef; padding: 24px; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; border: 1.5px solid #1c1a18; border-radius: 16px; padding: 32px; }
    h1 { margin: 0 0 16px; font-size: 24px; }
    p { line-height: 1.6; }
    .btn { display: inline-block; padding: 12px 24px; background: #4f9b6a; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; }
    .footer { margin-top: 24px; color: #888; font-size: 13px; text-align: center; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <div class="card">
    {% block body %}{% endblock %}
  </div>
  <div class="footer">TestMasterBSU</div>
</body>
</html>
