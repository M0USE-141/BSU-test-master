{% extends "base.html" %}
{% block body %}
<h1>{{ subject }}</h1>
<p>Hi {{ user.display_name or user.username }},</p>
<p>Your change request for "{{ test_title }}" was {{ verdict }}.{% if comment %} Reviewer comment: "{{ comment }}"{% endif %}</p>
{% if action_url %}<p style="margin: 24px 0;"><a href="{{ action_url }}" class="btn">Open test</a></p>
{% endif %}{% endblock %}
