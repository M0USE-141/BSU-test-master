<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TestMasterBSU — Mobile prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
  :root {
    --wf-paper: #f9f6ef;
    --wf-ink: #1c1a18;
    --wf-ink-mute: rgba(28,26,24,0.35);
    --wf-ink-soft: rgba(28,26,24,0.06);
    --wf-ink-fade: rgba(28,26,24,0.55);
    --wf-accent: #4f9b6a;
    --wf-accent-soft: rgba(79,155,106,0.14);
    --wf-hand: 'Inter', system-ui, sans-serif;
    --wf-mono: 'JetBrains Mono', monospace;
    --wf-pad: 16px;
  }
  [data-wf-theme="dark"] {
    --wf-paper: #1a1714;
    --wf-ink: #f3ece0;
    --wf-ink-mute: rgba(243,236,224,0.30);
    --wf-ink-soft: rgba(243,236,224,0.08);
    --wf-ink-fade: rgba(243,236,224,0.55);
  }
  [data-wf-font="hand"] { --wf-hand: 'Caveat', 'Kalam', cursive; }
  [data-wf-density="compact"] { --wf-pad: 12px; }
  [data-wf-density="roomy"] { --wf-pad: 20px; }

  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, #f0ebde 0%, #d8d2c5 100%);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--wf-ink);
    height: 100%;
    overflow: hidden;
  }
  [data-wf-theme="dark"] body { background: radial-gradient(ellipse at top, #1a1714 0%, #0a0807 100%); }
  body { -webkit-font-smoothing: antialiased; }
  #root { height: 100vh; }

  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
  }
  .phone {
    position: relative;
    width: 390px; height: 820px;
    max-height: calc(100vh - 40px);
    background: var(--wf-paper);
    border-radius: 44px;
    border: 12px solid var(--wf-ink);
    overflow: hidden;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.25),
      0 16px 40px rgba(0,0,0,0.14),
      inset 0 0 0 2px rgba(255,255,255,0.05);
    display: flex; flex-direction: column;
  }
  .phone::before {
    content: ''; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 24px;
    background: var(--wf-ink);
    border-radius: 0 0 16px 16px;
    z-index: 50;
  }
  .phone::after {
    content: ''; position: absolute; bottom: 6px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 4px;
    background: var(--wf-ink);
    border-radius: 999px;
    opacity: 0.4;
    z-index: 50;
  }

  /* Floating side note */
  .side-note {
    position: absolute;
    left: 32px; top: 32px;
    max-width: 240px;
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--wf-ink-fade);
    line-height: 1.3;
  }
  .side-note h2 {
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 26px;
    margin: 0 0 8px;
    color: var(--wf-ink);
  }
  .side-note ul { padding-left: 16px; margin: 8px 0; }
  .side-note li { margin: 3px 0; }

  /* Phone scale wrapper */
  @media (max-height: 880px) {
    .phone { transform: scale(0.92); transform-origin: center; }
  }
  @media (max-height: 760px) {
    .phone { transform: scale(0.80); transform-origin: center; }
  }
  @media (max-width: 700px) {
    .side-note { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframe-primitives.jsx"></script>
<script type="text/babel" src="stats-screens.jsx"></script>
<script type="text/babel" src="desktop-combined.jsx"></script>
<script type="text/babel" src="prototype-router.jsx"></script>
<script type="text/babel" src="prototype-desktop-2.jsx"></script>
<script type="text/babel" src="prototype-mobile.jsx"></script>

<script type="text/babel">
const {
  TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakColor,
  RouterProvider, useRouter,
  PreTestModalI, QTypeModal, ShareModalI,
  MobileHome, MobileCollection, MobileTakingI, MobileResultsI,
  MobileStatsI, MobileProfileI, MobileTestsList, MobileDrawerI, MobileNotifications,
  MobileSettings, MobileChangeRequests,
} = window;

const DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "font": "typed",
  "density": "normal",
  "accent": "#4f9b6a"
}/*EDITMODE-END*/;

const ACCENTS = [
  { color: '#e07a5f', soft: 'rgba(224,122,95,0.14)' },
  { color: '#e6b54a', soft: 'rgba(230,181,74,0.18)' },
  { color: '#4a78c4', soft: 'rgba(74,120,196,0.14)' },
  { color: '#4f9b6a', soft: 'rgba(79,155,106,0.14)' },
  { color: '#3a3530', soft: 'rgba(58,53,48,0.10)' },
];
const accentSoft = (c) => (ACCENTS.find((a) => a.color === c) || ACCENTS[0]).soft;

function MobileShell() {
  const { state } = useRouter();
  let view;
  switch (state.view) {
    case 'collection':      view = <MobileCollection/>; break;
    case 'taking':          view = <MobileTakingI/>; break;
    case 'results':         view = <MobileResultsI/>; break;
    case 'notifications':   view = <MobileNotifications/>; break;
    case 'change-requests': view = <MobileChangeRequests/>; break;
    case 'settings':        view = <MobileSettings/>; break;
    default: {
      switch (state.mobileNav) {
        case 'tests': view = <MobileTestsList/>; break;
        case 'stats': view = <MobileStatsI/>; break;
        case 'me':    view = <MobileProfileI/>; break;
        default:      view = <MobileHome/>;
      }
    }
  }

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, position: 'relative', background: 'var(--wf-paper)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--wf-hand)', fontSize: 12, padding: '14px 22px 4px', flexShrink: 0, color: 'var(--wf-ink)' }}>
        <span style={{ fontWeight: 600 }}>9:41</span>
        <span>● ● ● ▮</span>
      </div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, position: 'relative' }}>
        {view}
        {state.mobileMenuOpen && <MobileDrawerI/>}
        {state.modal === 'pretest' && <PreTestModalI/>}
        {state.modal === 'qtype'   && <QTypeModal/>}
        {state.modal === 'share'   && <ShareModalI/>}
      </div>
    </div>
  );
}

function App() {
  const [t, setT] = useTweaks(DEFAULTS);
  React.useEffect(() => {
    const root = document.documentElement;
    root.dataset.wfTheme = t.theme;
    root.dataset.wfFont = t.font;
    root.dataset.wfDensity = t.density;
    root.style.setProperty('--wf-accent', t.accent);
    root.style.setProperty('--wf-accent-soft', accentSoft(t.accent));
  }, [t]);

  return (
    <RouterProvider device="mobile">
      <div className="stage">
        <div className="side-note">
          <h2>Mobile prototype</h2>
          <p>Tap anything — full flow is wired up:</p>
          <ul>
            <li>Home → tap a collection</li>
            <li>Tap <b>Start</b> → pretest → questions</li>
            <li>Pick answers (mixed text + img + formula)</li>
            <li>Finish → live score</li>
            <li>Bottom nav: Home / Tests / Stats / Me</li>
            <li>Hamburger → side menu</li>
            <li>Bell → notifications</li>
          </ul>
          <p style={{ marginTop: 14, opacity: 0.7 }}>Tweaks panel → bottom-right.</p>
        </div>
        <div className="phone">
          <MobileShell/>
        </div>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Display">
          <TweakRadio
            label="Theme"
            value={t.theme}
            options={[{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }]}
            onChange={(v) => setT('theme', v)}/>
          <TweakRadio
            label="Font"
            value={t.font}
            options={[{ value: 'hand', label: 'Handwritten' }, { value: 'typed', label: 'Typed' }]}
            onChange={(v) => setT('font', v)}/>
          <TweakRadio
            label="Density"
            value={t.density}
            options={[
              { value: 'compact', label: 'Compact' },
              { value: 'normal', label: 'Normal' },
              { value: 'roomy', label: 'Roomy' },
            ]}
            onChange={(v) => setT('density', v)}/>
        </TweakSection>
        <TweakSection label="Color">
          <TweakColor
            label="Accent"
            value={t.accent}
            options={ACCENTS.map((a) => a.color)}
            onChange={(v) => setT('accent', v)}/>
        </TweakSection>
      </TweaksPanel>
    </RouterProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
