<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TestMasterBSU — Interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
  :root {
    --wf-paper: #f9f6ef;
    --wf-ink: #1c1a18;
    --wf-ink-mute: rgba(28,26,24,0.35);
    --wf-ink-soft: rgba(28,26,24,0.06);
    --wf-ink-fade: rgba(28,26,24,0.55);
    --wf-accent: #e07a5f;
    --wf-accent-soft: rgba(224,122,95,0.14);
    --wf-hand: 'Caveat', 'Kalam', 'Comic Sans MS', cursive;
    --wf-mono: 'JetBrains Mono', monospace;
    --wf-pad: 18px;
  }
  [data-wf-theme="dark"] {
    --wf-paper: #1a1714;
    --wf-ink: #f3ece0;
    --wf-ink-mute: rgba(243,236,224,0.30);
    --wf-ink-soft: rgba(243,236,224,0.08);
    --wf-ink-fade: rgba(243,236,224,0.55);
  }
  [data-wf-font="typed"] { --wf-hand: 'Inter', system-ui, sans-serif; }
  [data-wf-density="compact"] { --wf-pad: 12px; }
  [data-wf-density="roomy"] { --wf-pad: 24px; }

  html, body {
    margin: 0; padding: 0;
    background: #ece8df;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--wf-ink);
    height: 100%;
    overflow: hidden;
  }
  #root { height: 100vh; }
  [data-wf-theme="dark"] body { background: #100e0c; }
  body { -webkit-font-smoothing: antialiased; }

  /* Phone frame */
  .phone-stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #ece8df;
  }
  [data-wf-theme="dark"] .phone-stage { background: #100e0c; }
  .phone-frame {
    position: relative;
    width: 390px; height: 820px;
    background: var(--wf-paper);
    border-radius: 44px;
    border: 12px solid var(--wf-ink);
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.12);
  }
  .phone-frame::before {
    content: ''; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 22px;
    background: var(--wf-ink);
    border-radius: 0 0 14px 14px;
    z-index: 50;
  }
  .desktop-stage {
    width: 100%; height: 100%;
    background: var(--wf-paper);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframe-primitives.jsx"></script>
<script type="text/babel" src="stats-screens.jsx"></script>
<script type="text/babel" src="desktop-combined.jsx"></script>
<script type="text/babel" src="prototype-router.jsx"></script>
<script type="text/babel" src="prototype-desktop.jsx"></script>
<script type="text/babel" src="prototype-desktop-2.jsx"></script>
<script type="text/babel" src="prototype-mobile.jsx"></script>

<script type="text/babel">
const {
  TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakColor, TweakToggle,
  RouterProvider, useRouter,
  TopBar, DesktopHome, DesktopTaking, DesktopResults, DesktopNotifications,
  DesktopChangeRequests, DesktopEmpty, DesktopSettings, DesktopImport,
  PreTestModalI, QTypeModal, SearchModal, ShareModalI,
  MobileHome, MobileCollection, MobileTakingI, MobileResultsI,
  MobileStatsI, MobileProfileI, MobileTestsList, MobileDrawerI, MobileNotifications,
  MobileSettings, MobileChangeRequests,
} = window;

const DEFAULTS = /*EDITMODE-BEGIN*/{
  "device": "desktop",
  "theme": "light",
  "font": "typed",
  "density": "normal",
  "accent": "#4f9b6a"
}/*EDITMODE-END*/;

const ACCENTS = [
  { color: '#e07a5f', soft: 'rgba(224,122,95,0.14)' },
  { color: '#e6b54a', soft: 'rgba(230,181,74,0.18)' },
  { color: '#4a78c4', soft: 'rgba(74,120,196,0.14)' },
  { color: '#4f9b6a', soft: 'rgba(79,155,106,0.14)' },
  { color: '#3a3530', soft: 'rgba(58,53,48,0.10)' },
];
const accentSoft = (c) => (ACCENTS.find((a) => a.color === c) || ACCENTS[0]).soft;

function DesktopApp() {
  const { state, dispatch } = useRouter();
  let view;
  switch (state.view) {
    case 'taking':           view = <DesktopTaking/>; break;
    case 'results':          view = <DesktopResults/>; break;
    case 'notifications':    view = <DesktopNotifications/>; break;
    case 'change-requests':  view = <DesktopChangeRequests/>; break;
    case 'settings':         view = <DesktopSettings/>; break;
    case 'import':           view = <DesktopImport/>; break;
    case 'empty':            view = <DesktopEmpty/>; break;
    default:                 view = <DesktopHome/>;
  }
  const showTop = !['taking'].includes(state.view);
  return (
    <div className="desktop-stage" style={{ position: 'relative' }}>
      {showTop && <TopBar/>}
      {view}
      {state.modal === 'pretest' && <PreTestModalI/>}
      {state.modal === 'qtype'   && <QTypeModal/>}
      {state.modal === 'search'  && <SearchModal/>}
      {state.modal === 'share'   && <ShareModalI/>}
    </div>
  );
}

function MobileApp() {
  const { state, dispatch } = useRouter();

  // Mobile routing: top-level views override; otherwise mobileNav determines
  let view;
  switch (state.view) {
    case 'collection':      view = <MobileCollection/>; break;
    case 'taking':          view = <MobileTakingI/>; break;
    case 'results':         view = <MobileResultsI/>; break;
    case 'notifications':   view = <MobileNotifications/>; break;
    case 'change-requests': view = <MobileChangeRequests/>; break;
    case 'settings':        view = <MobileSettings/>; break;
    default: {
      // 'home' view, route by mobileNav
      switch (state.mobileNav) {
        case 'tests': view = <MobileTestsList/>; break;
        case 'stats': view = <MobileStatsI/>; break;
        case 'me':    view = <MobileProfileI/>; break;
        default:      view = <MobileHome/>;
      }
    }
  }

  return (
    <div className="phone-stage">
      <div className="phone-frame" style={{ display: 'flex', flexDirection: 'column' }}>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, position: 'relative', background: 'var(--wf-paper)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--wf-hand)', fontSize: 12, padding: '14px 22px 4px', flexShrink: 0, color: 'var(--wf-ink)' }}>
            <span>9:41</span>
            <span>● ● ● ▮</span>
          </div>
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, position: 'relative' }}>
            {view}
            {state.mobileMenuOpen && <MobileDrawerI/>}
            {state.modal === 'pretest' && <PreTestModalI/>}
            {state.modal === 'qtype'   && <QTypeModal/>}
            {state.modal === 'share'   && <ShareModalI/>}
          </div>
        </div>
      </div>
    </div>
  );
}

function Shell() {
  const { state } = useRouter();
  return state.device === 'mobile' ? <MobileApp/> : <DesktopApp/>;
}

function App() {
  const [t, setT] = useTweaks(DEFAULTS);
  React.useEffect(() => {
    const root = document.documentElement;
    root.dataset.wfTheme = t.theme;
    root.dataset.wfFont = t.font;
    root.dataset.wfDensity = t.density;
    root.style.setProperty('--wf-accent', t.accent);
    root.style.setProperty('--wf-accent-soft', accentSoft(t.accent));
  }, [t]);

  return (
    <RouterProvider device={t.device}>
      <Shell/>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Device">
          <TweakRadio
            label="View as"
            value={t.device}
            options={[{ value: 'desktop', label: 'Desktop' }, { value: 'mobile', label: 'Mobile' }]}
            onChange={(v) => setT('device', v)}/>
        </TweakSection>
        <TweakSection label="Display">
          <TweakRadio
            label="Theme"
            value={t.theme}
            options={[{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }]}
            onChange={(v) => setT('theme', v)}/>
          <TweakRadio
            label="Font"
            value={t.font}
            options={[{ value: 'hand', label: 'Handwritten' }, { value: 'typed', label: 'Typed' }]}
            onChange={(v) => setT('font', v)}/>
          <TweakRadio
            label="Density"
            value={t.density}
            options={[
              { value: 'compact', label: 'Compact' },
              { value: 'normal', label: 'Normal' },
              { value: 'roomy', label: 'Roomy' },
            ]}
            onChange={(v) => setT('density', v)}/>
        </TweakSection>
        <TweakSection label="Color">
          <TweakColor
            label="Accent"
            value={t.accent}
            options={ACCENTS.map((a) => a.color)}
            onChange={(v) => setT('accent', v)}/>
        </TweakSection>
      </TweaksPanel>
    </RouterProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
